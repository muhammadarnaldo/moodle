issueNumber: MDL-87832
notes:
  core_courseformat:
    - message: >-
        When the activity name is editable (editing mode on and the user can
        manage activities), the `core_courseformat/local/content/cm/title`
        template no longer renders a link to the activity. The whole title is
        now the inplace editable trigger, so clicking it renames the activity
        instead of opening it. Behat scenarios that click an activity name on
        the course page with editing mode on should navigate with
        `I am on the "<activity name>" "<modname> activity" page` instead.
      type: changed
  core:
    - message: >-
        The `core/inplace_editable` trigger can now also be activated with the
        Space key, and moving the focus away from the editor (for example with
        Tab) no longer returns the focus to the trigger. Saved values are
        announced to screen reader users.
      type: improved
